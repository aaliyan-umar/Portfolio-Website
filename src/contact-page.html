<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../styles/contact-page.css">
</head>
<body class="bg-gray-50 text-gray-800">
    <header class="bg-gradient-to-r from-green-500 to-blue-500 text-white shadow-md">
        <div class="container mx-auto px-6 py-4">
            <h1 class="text-3xl font-bold">Contact Me</h1>
            <p class="text-lg">I'd love to hear from you. Feel free to reach out!</p>
        </div>
    </header>

    <main class="container mx-auto px-6 py-8">
        <section class="bg-white rounded-lg shadow-lg p-8">
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Get in Touch</h2>
            <p class="text-gray-600 mb-6">Fill out the form below, and I'll get back to you as soon as possible.</p>
            <form action="#" method="POST" class="space-y-6">
                <div>
                    <label for="name" class="block text-gray-700 font-medium">Your Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        class="w-full mt-2 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="Enter your name"
                        required
                    />
                </div>
                <div>
                    <label for="email" class="block text-gray-700 font-medium">Your Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="w-full mt-2 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="Enter your email"
                        required
                    />
                </div>
                <div>
                    <label for="message" class="block text-gray-700 font-medium">Your Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        class="w-full mt-2 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="Write your message here"
                        required
                    ></textarea>
                </div>
                <button
                    type="submit"
                    class="px-6 py-3 bg-green-500 text-white font-medium rounded-lg hover:bg-green-600 transition duration-300"
                >
                    Send Message
                </button>
            </form>
        </section>
    </main>

    <footer class="bg-gray-800 text-gray-300 py-4">
        <div class="container mx-auto px-6 text-center">
            <p>&copy; 2025 My Portfolio. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
